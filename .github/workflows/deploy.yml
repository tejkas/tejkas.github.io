name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without a new commit.
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read from .nvmrc so CI and your machine can't drift apart. They
      # must match: npm 10 and npm 11 resolve the same lockfile into
      # different trees, and `npm ci` fails outright on the mismatch.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm install`, not `npm ci`, on purpose.
      #
      # Sharp (Astro's image optimiser) pulls platform-specific binaries
      # whose own deps npm resolves differently per OS: on macOS it nests
      # @emnapi under @bruits/satteri-wasm32-wasi, on Linux it hoists them
      # to the top level and re-resolves `^1.11.1` to whatever patch is
      # newest. A lockfile generated on one OS therefore never satisfies
      # `npm ci` on the other, and pinning the exact version just moves
      # the breakage to the next upstream patch release.
      #
      # `npm install` honours the lockfile for everything it can and heals
      # only that optional platform subtree. The trade-off is that those
      # few binaries aren't byte-pinned across builds — which for a static
      # site that produces the same HTML either way is not worth the
      # recurring red X.
      - run: npm install --no-audit --no-fund
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
