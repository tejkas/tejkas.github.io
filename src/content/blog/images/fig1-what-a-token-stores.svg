<text x="305.0" y="122.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >keys, 8 heads × 128</text>
<text x="555.0" y="122.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >values, 8 heads × 128</text>
<text x="688.0" y="99.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >2,048</text>
<text x="180.0" y="144.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >32 query heads read in groups of 4; each group has its own key and value.</text>
<text x="24.0" y="191.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >DeepSeek-V2-Lite (MLA)</text>
