<text x="24.0" y="34.0" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >What one token stores, per layer</text>
<text x="24.0" y="54.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="normal" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Every KV-cache method that ranks tokens by their keys assumes the top row.</text>
<text x="24.0" y="99.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, sans-serif" >Mistral-7B (GQA)</text>
